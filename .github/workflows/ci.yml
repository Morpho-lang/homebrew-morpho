name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HOMEBREW_NO_ANALYTICS: 1
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1

jobs:
  tap-syntax:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/homebrew/brew:main
      options: --privileged
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@df4b09108a1de9d6f995fe68f302b3f68bd6d2ef # 2026.07.20.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - run: brew test-bot --only-tap-syntax

  install-and-test:
    needs: tap-syntax
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-26]
        include:
          - os: ubuntu-latest
            container:
              image: ghcr.io/homebrew/brew:main
              options: --privileged
    runs-on: ${{ matrix.os }}
    container: ${{ fromJSON(toJSON(matrix.container)) }}
    timeout-minutes: 120
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@df4b09108a1de9d6f995fe68f302b3f68bd6d2ef # 2026.07.20.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@v4
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ matrix.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ matrix.os }}-rubygems-

      - name: Install all Morpho formulae
        run: |
          brew install --build-from-source \
            morpho \
            morpho-cli \
            morpho-morphoview \
            morpho-morphopm

      - name: Run formula tests
        run: |
          brew test --verbose morpho
          brew test --verbose morpho-cli
          brew test --verbose morpho-morphoview
          brew test --verbose morpho-morphopm

      - name: Smoke-check installed binaries
        run: |
          test -f "$(brew --prefix)/include/morpho/morpho.h"
          test -x "$(brew --prefix)/bin/morpho6"
          test -x "$(brew --prefix)/bin/morphoview"
          test -x "$(brew --prefix)/bin/morphopm"

          morphopm version
          printf 'print "CI ok"\n' > hello.morpho
          morpho6 hello.morpho | grep -F "CI ok"
